# Adapted from terraform-provider-wayfinder's .goreleaser.yml for the ipam CLI.
# Local dry run (no signing, no publishing):
#   goreleaser release --snapshot --clean --skip=sign,publish
version: 2
project_name: ipam
builds:
  - id: ipam
    main: ./cmd/ipam
    binary: ipam
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"
release:
  github:
    owner: appvia
    name: ipam
  draft: false
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
