name: Requirement
description: A business need in business language. An intake agent will ask follow-up questions in comments.
title: "[Requirement] "
type: Requirement
body:
  - type: markdown
    attributes:
      value: "Describe the need in business terms. Do not include real data, client identifiers or credentials."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "Who is affected today, and how?"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: "What changes when this is done? Give a measurable target if you can."
      placeholder: "Onboarding a tenant takes under 1 day, down from 5"
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Who benefits
      description: "The users or teams who gain from this."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: "Deadlines, regulation, budget or dependencies. Write \"None\" if there are none."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: "Anything this Requirement should not cover."
    validations:
      required: false
