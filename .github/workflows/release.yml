name: Release

# Builds the ipam CLI with goreleaser and publishes a GitHub release when a
# v* tag is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MISE_LOCKED: "1"
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  goreleaser:
    if: github.repository == 'appvia/ipam'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install_args: go goreleaser
      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
