# Managed by appvia/agentic-delivery (repo-sync). Edit it there.
# Relays product-repo events to the central router as workflow_dispatch hints.
# The router treats every input as an untrusted hint and re-reads all facts
# from GitHub. Values reach the shell only through env, never through
# expressions inside `run:`, and issue/PR titles, bodies and comment text are
# never passed at all.
name: agentic-relay

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]
  push:

permissions: {}

jobs:
  relay:
    name: relay
    # Cost filter: skip events the routing table never uses.
    #   issues: edits only when a human made them
    #   issue_comment: comments on issues, not on PRs
    #   pull_request: closed only when merged
    #   pull_request_review: changes requested only
    #   push: default branch only
    if: >-
      ${{
        (github.event_name == 'issues' && (github.event.action != 'edited' || github.event.sender.type == 'User')) ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request) ||
        (github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged)) ||
        (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested') ||
        (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint relay App token
        id: relay-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENTIC_RELAY_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_RELAY_APP_PRIVATE_KEY }}
          owner: appvia
          repositories: agentic-delivery
          permission-actions: write

      - name: Dispatch router
        env:
          GH_TOKEN: ${{ steps.relay-token.outputs.token }}
          TARGET_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh workflow run router.yml -R appvia/agentic-delivery --ref main \
            -f target_repo="$TARGET_REPO" \
            -f event_name="$EVENT_NAME" \
            -f action="$ACTION" \
            -f number="$NUMBER" \
            -f label="$LABEL" \
            -f actor="$ACTOR" \
            -f comment_id="$COMMENT_ID" \
            -f head_sha="$HEAD_SHA" \
            -f delivery_id="$DELIVERY_ID"
          echo "relayed $EVENT_NAME.$ACTION for $TARGET_REPO#$NUMBER (delivery $DELIVERY_ID)"
