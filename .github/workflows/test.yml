name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install_args: go
      - name: Test (race)
        if: runner.os == 'Linux'
        run: make test
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./... -count=1 -timeout 20m

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install_args: go golangci-lint
      - name: Lint
        run: golangci-lint run
      - name: License headers
        run: ./scripts/license-headers.sh --check
      - name: Script tests
        run: make test-scripts

  integration:
    name: integration (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
          install_args: go node jq npm:azurite go:github.com/minio/minio
      - name: Start emulators and probe
        run: |
          bash scripts/emulators/start-azurite.sh
          bash scripts/emulators/start-s3.sh
          go run ./scripts/emulators/probe
      - name: Integration tests
        run: make test-integration
