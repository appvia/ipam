name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-lint:
    name: test and lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  windows:
    name: windows file lock
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test storage/local
        run: go test ./storage/local/... -count=1

  integration:
    name: integration (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start emulators and probe
        run: |
          bash scripts/emulators/start-azurite.sh
          bash scripts/emulators/start-s3.sh
          go run ./scripts/emulators/probe
      - name: Integration tests
        run: make test-integration
